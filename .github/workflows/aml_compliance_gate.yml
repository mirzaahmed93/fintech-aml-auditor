name: Fintech AML Compliance Gatekeeper

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'compliance_engine.py'
      - 'docs/**'
      - 'requirements.txt'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'compliance_engine.py'
  workflow_dispatch:

jobs:
  aml-audit:
    name: FinCEN & BSA Compliance Perimeter Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AML Compliance Gatekeeper Audit
        run: |
          python github_action_auditor.py --target-file src/matcher_agent.py
